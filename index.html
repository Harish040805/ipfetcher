<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Fetcher</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: "Poppins", sans-serif; background: linear-gradient(135deg, #e8f1ff, #ffffff); color: #0d1b3d; }
        .container { max-width: 900px; margin: 40px auto; background: #ffffff; padding: 35px; border-radius: 20px; box-shadow: 0 12px 35px rgba(0, 64, 150, 0.12); }
        h1 { text-align: center; margin-bottom: 10px; font-size: 26px; color: #005ad6; font-weight: 600; }
        .brand { text-align: center; color: #888; font-size: 14px; margin-bottom: 20px; }
        .controls { text-align: center; margin-bottom: 25px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        input[type="text"] { width: 40%; padding: 12px 15px; border: 2px solid #cfdfff; border-radius: 6px; outline: none; }
        button { padding: 12px 18px; border: none; border-radius: 6px; background: #2f7dff; color: white; cursor: pointer; transition: 0.25s; }
        button:hover { background: #1459d9; transform: translateY(-2px); }
        #result { margin-top: 15px; padding: 15px; background: #f3f7ff; border-left: 4px solid #2f7dff; border-radius: 6px; line-height: 1.6; }
        #map { height: 400px; width: 100%; margin-top: 20px; border-radius: 12px; border: 1px solid #ddd; }
    </style>
</head>
<body>
<div class="container">
    <p class="brand">Harish Creations - Cyber Security Lab</p>
    <h1>Advanced IP & Geolocation Tracker</h1>
    <div class="controls">
        <input type="text" id="ipInput" placeholder="Enter IPv4 or IPv6 address">
        <button onclick="getIPInfo(false)">Lookup IP</button>
        <button style="background: #6c757d;" onclick="getIPInfo(true)">My IP Info</button>
        <button style="background: #28a745;" onclick="getBrowserLocation()">Share GPS Location</button>
    </div>
    <div id="result">Results will appear here...</div>
    <div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="ipfetcherjs.js"></script>
</body>
</html>
